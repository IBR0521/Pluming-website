<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" fill="none"
     stroke-linecap="round" stroke-linejoin="round" font-family="'Space Mono', ui-monospace, monospace">
  <!-- ================================================================
       COMMERCIAL MECHANICAL RISER — decorative technical schematic
       copper runs #b87333 · instrumentation & annotation #ffffff
       ultra-thin strokes; parent element controls opacity
       ================================================================ -->

  <!-- ========== registration marks ========== -->
  <g stroke="#ffffff" stroke-width="0.9" opacity="0.75">
    <path d="M40 40h26M53 27v26M860 40h-26M847 27v26M40 860h26M53 847v26M860 860h-26M847 847v26"/>
    <circle cx="53" cy="40" r="4.5"/><circle cx="847" cy="40" r="4.5"/>
    <circle cx="53" cy="860" r="4.5"/><circle cx="847" cy="860" r="4.5"/>
  </g>

  <!-- ========== main vertical riser (double-line copper) ========== -->
  <g stroke="#b87333" stroke-width="1.15">
    <path d="M214 132 V760"/><path d="M232 132 V760"/>
    <!-- welded joint ticks -->
    <g stroke-width="0.85" opacity="0.85">
      <path d="M210 250h26M210 402h26M210 556h26M210 688h26"/>
    </g>
  </g>

  <!-- ========== branch 1: tee -> gate valve -> gauge ========== -->
  <g stroke="#b87333" stroke-width="1.15">
    <path d="M232 214 H392"/><path d="M232 232 H392"/>
    <path d="M226 206 h14v34h-14z" stroke-width="0.9"/>       <!-- tee body -->
    <path d="M470 214 H612"/><path d="M470 232 H612"/>
  </g>
  <!-- gate valve (bowtie + stem + handwheel) -->
  <g stroke="#ffffff" stroke-width="1.05">
    <path d="M396 246 L431 223 L396 200 Z"/>
    <path d="M466 246 L431 223 L466 200 Z"/>
    <path d="M431 223 V176"/>
    <path d="M404 170 H458"/>
    <path d="M410 170 q21 -18 42 0" stroke-width="0.9"/>
    <circle cx="431" cy="168" r="4"/>
  </g>

  <!-- ========== branch 2: reducer -> ball valve -> elbow down ========== -->
  <g stroke="#b87333" stroke-width="1.15">
    <path d="M232 402 H352"/><path d="M232 420 H352"/>
    <!-- concentric reducer -->
    <path d="M352 402 L392 408" /><path d="M352 420 L392 414"/>
    <path d="M392 408 H470"/><path d="M392 414 H470"/>
    <!-- elbow down + drop leg -->
    <path d="M556 402 H612 V556"/><path d="M556 420 H594 V556"/>
    <path d="M594 560 h18v14h-18z" stroke-width="0.9"/>
  </g>
  <!-- ball valve + lever -->
  <g stroke="#ffffff" stroke-width="1.05">
    <circle cx="513" cy="411" r="20"/>
    <path d="M470 411 H493M533 411 H556"/>
    <path d="M470 399 V423M556 399 V423" stroke-width="0.9"/>
    <path d="M513 411 L537 383"/>
    <circle cx="537" cy="383" r="4.5"/>
    <path d="M501 411 a12 12 0 0 1 24 0" stroke-width="0.75" opacity="0.8"/>
  </g>

  <!-- ========== branch 3: check valve -> circulator pump ========== -->
  <g stroke="#b87333" stroke-width="1.15">
    <path d="M232 556 H360"/><path d="M232 574 H360"/>
    <path d="M436 556 H520"/><path d="M436 574 H520"/>
  </g>
  <!-- check valve (flapper) -->
  <g stroke="#ffffff" stroke-width="1.05">
    <rect x="362" y="548" width="72" height="34" rx="2"/>
    <path d="M372 582 L418 548"/>
    <circle cx="372" cy="582" r="3"/>
  </g>
  <!-- circulator pump (circle + impeller triangle) -->
  <g stroke="#ffffff" stroke-width="1.05">
    <circle cx="560" cy="565" r="34"/>
    <path d="M545 545 L590 565 L545 585 Z" stroke-width="0.9"/>
    <path d="M526 565 H520M594 565 H600" />
    <path d="M560 531 V519M560 599 V611" stroke-width="0.85" opacity="0.8"/>
  </g>

  <!-- ========== flange detail (bolt circle) ========== -->
  <g stroke="#ffffff" stroke-width="1.05" transform="translate(223 760)">
    <circle r="44"/><circle r="27" stroke-width="0.9"/><circle r="13" opacity="0.75" stroke-width="0.85"/>
    <g fill="#ffffff" stroke="none" opacity="0.9">
      <circle cx="0" cy="-35" r="2.6"/><circle cx="30" cy="-17" r="2.6"/><circle cx="30" cy="17" r="2.6"/>
      <circle cx="0" cy="35" r="2.6"/><circle cx="-30" cy="17" r="2.6"/><circle cx="-30" cy="-17" r="2.6"/>
    </g>
    <path d="M-44 0 H-58M44 0 H58" stroke-width="0.85" opacity="0.7"/>
  </g>

  <!-- ========== primary pressure gauge ========== -->
  <g stroke="#ffffff" stroke-width="1.05" transform="translate(660 214)">
    <circle r="46"/><circle r="37" stroke-width="0.85" opacity="0.8"/>
    <g stroke-width="0.85" opacity="0.9">
      <path d="M0 -37 V-29M26 -26 L21 -21M37 0 H29M26 26 L21 21M0 37 V29M-26 26 L-21 21M-37 0 H-29M-26 -26 L-21 -21"/>
    </g>
    <path d="M0 0 L21 -24" stroke="#b87333" stroke-width="1.3"/>
    <circle r="3.4" fill="#ffffff" stroke="none"/>
    <path d="M0 46 V70" stroke="#b87333" stroke-width="1.15"/>
    <path d="M-11 70 H11" stroke-width="0.9"/>
  </g>

  <!-- ========== secondary gauge (smaller) ========== -->
  <g stroke="#ffffff" stroke-width="0.95" transform="translate(700 640)">
    <circle r="30"/><circle r="23" stroke-width="0.8" opacity="0.8"/>
    <path d="M0 0 L-15 -18" stroke="#b87333" stroke-width="1.15"/>
    <circle r="2.6" fill="#ffffff" stroke="none"/>
    <path d="M0 -30 V-24M30 0 H24M0 30 V24M-30 0 H-24" stroke-width="0.8"/>
    <path d="M0 30 V52" stroke="#b87333" stroke-width="1.05"/>
  </g>

  <!-- ========== section detail callout ========== -->
  <g stroke="#ffffff" stroke-width="0.9" opacity="0.85">
    <circle cx="513" cy="411" r="74" stroke-dasharray="5 6"/>
    <path d="M565 463 L640 520"/>
    <text x="646" y="527" font-size="13" fill="#ffffff" stroke="none" letter-spacing="1">DET. A</text>
  </g>

  <!-- ========== dimension lines ========== -->
  <g stroke="#ffffff" stroke-width="0.85" opacity="0.85">
    <path d="M214 828 H612"/>
    <path d="M214 820 V836M612 820 V836"/>
    <path d="M222 824 L214 828 L222 832M604 824 L612 828 L604 832"/>
    <path d="M726 132 H812"/>
    <path d="M726 124 V140M812 124 V140"/>
    <path d="M734 128 L726 132 L734 136M804 128 L812 132 L804 136"/>
  </g>

  <!-- ========== annotations ========== -->
  <g fill="#ffffff" stroke="none" font-size="13" letter-spacing="1.2" opacity="0.92">
    <text x="413" y="820" text-anchor="middle">Ø54 CU · L=2400</text>
    <text x="769" y="120" text-anchor="middle">H=860</text>
    <text x="431" y="152" text-anchor="middle">GV-4</text>
    <text x="513" y="356" text-anchor="middle">BV-2</text>
    <text x="398" y="614" >CV-1</text>
    <text x="560" y="632" text-anchor="middle">P-1 · 3/4 HP</text>
    <text x="660" y="306" text-anchor="middle">PT-01 · 0–160 PSI</text>
    <text x="700" y="712" text-anchor="middle">PT-02</text>
    <text x="223" y="836" text-anchor="middle">DN50 · PN16</text>
    <text x="252" y="128" font-size="12" opacity="0.8">RISER R-1</text>
  </g>

  <!-- ========== title block ========== -->
  <g stroke="#ffffff" stroke-width="0.9">
    <rect x="560" y="756" width="290" height="94"/>
    <path d="M560 790 H850M665 790 V850M760 790 V850"/>
  </g>
  <g fill="#ffffff" stroke="none" letter-spacing="1.2">
    <text x="570" y="778" font-size="13">MECHANICAL RISER — POTABLE CW</text>
    <text x="570" y="810" font-size="10" opacity="0.75">SHEET</text>
    <text x="570" y="834" font-size="16">M-204</text>
    <text x="675" y="810" font-size="10" opacity="0.75">SCALE</text>
    <text x="675" y="834" font-size="16">1:20</text>
    <text x="770" y="810" font-size="10" opacity="0.75">REV</text>
    <text x="770" y="834" font-size="16">C</text>
  </g>
</svg>
